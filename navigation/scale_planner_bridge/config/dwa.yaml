planner_plugin: dwa_local_planner/DWAPlannerROS
global_frame: map
base_frame: base_link
odom_topic: /scale_planner_bridge/odom
planner_period: 0.05
smoke_duration: 6.0
external_xy_tolerance: 0.08
external_yaw_tolerance: 0.10
planner:
  odom_topic: /scale_planner_bridge/odom
  holonomic_robot: true
  max_vel_x: 0.45
  min_vel_x: -0.15
  max_vel_y: 0.35
  min_vel_y: -0.35
  max_vel_trans: 0.50
  min_vel_trans: 0.05
  max_vel_theta: 0.8
  min_vel_theta: -0.8
  min_in_place_vel_theta: 0.1
  acc_lim_x: 0.8
  acc_lim_y: 0.8
  acc_lim_theta: 1.5
  sim_time: 1.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 8
  vy_samples: 8
  vtheta_samples: 12
  path_distance_bias: 24.0
  goal_distance_bias: 20.0
  occdist_scale: 0.05
  forward_point_distance: 0.2
  stop_time_buffer: 0.2
  oscillation_reset_dist: 0.05
  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.10
  latch_xy_goal_tolerance: false
