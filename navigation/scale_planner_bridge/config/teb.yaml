planner_plugin: teb_local_planner/TebLocalPlannerROS
global_frame: map
base_frame: base_link
odom_topic: /scale_planner_bridge/odom
planner_period: 0.05
smoke_duration: 6.0
external_xy_tolerance: 0.08
external_yaw_tolerance: 0.10
planner:
  odom_topic: /scale_planner_bridge/odom
  map_frame: map

  teb_autosize: true
  dt_ref: 0.05
  dt_hysteresis: 0.005
  min_samples: 3
  max_samples: 500
  global_plan_overwrite_orientation: false
  allow_init_with_backwards_motion: false
  max_global_plan_lookahead_dist: 3.0
  exact_arc_length: true

  max_vel_x: 0.45
  max_vel_x_backwards: 0.15
  max_vel_y: 0.35
  max_vel_theta: 0.8
  acc_lim_x: 0.8
  acc_lim_y: 0.8
  acc_lim_theta: 1.5
  min_turning_radius: 0.0
  is_footprint_dynamic: false
  footprint_model:
    type: polygon
    vertices: [[-0.20, -0.15], [-0.20, 0.15], [0.20, 0.15], [0.20, -0.15]]

  xy_goal_tolerance: 0.08
  yaw_goal_tolerance: 0.10
  free_goal_vel: false
  complete_global_plan: true

  # TEB-only 1 mm numerical margin; benchmark collision truth and costmap geometry stay unchanged.
  min_obstacle_dist: 0.001
  inflation_dist: 0.0
  include_dynamic_obstacles: false
  include_costmap_obstacles: true
  costmap_converter_plugin: ""
  costmap_converter_spin_thread: false

  penalty_epsilon: 0.0
  weight_kinematics_nh: 0.0
  weight_kinematics_forward_drive: 0.0
  enable_homotopy_class_planning: false
  enable_multithreading: false
